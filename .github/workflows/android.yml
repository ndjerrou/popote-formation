# CI Popote : à chaque push / PR -> tests unitaires + APK debug ; sur tag v* -> AAB signé
name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jour1/Popote   # le projet Popote est rangé dans le dossier du jour 1
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (cache inclus)
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires (kata + app)
        run: ./gradlew :kata:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: APK debug
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: popote-debug-apk
          path: jour1/Popote/app/build/outputs/apk/debug/*.apk

  release:
    # Uniquement sur un tag v1.0.0, v1.1.0...
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jour1/Popote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Le keystore est stocké en base64 dans les "Secrets" GitHub du dépôt
      - name: Décoder le keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload.jks

      - name: AAB signé
        env:
          POPOTE_STORE_FILE: upload.jks
          POPOTE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POPOTE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POPOTE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: popote-release-aab
          path: jour1/Popote/app/build/outputs/bundle/release/*.aab
